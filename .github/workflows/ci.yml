name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create application package
        run: zip -r application.zip app.py requirements.txt

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: application.zip
  
  deploy:
    runs-on: ubuntu-latest
    needs: 
      - docker-build

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: application

      - name: List downloaded files
        run: ls -la

      - name: Deploy application
        run: echo "Deploying application.zip"          

  dependency-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Scan dependencies
        run: pip-audit -r requirements.txt  

  codeql:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3      

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - build
      - dependency-scan
      - codeql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-actions-demo .     

  container-scan:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-actions-demo .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: github-actions-demo
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH                  