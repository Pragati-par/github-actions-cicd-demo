name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest


  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run dependency scan
        run: pip-audit -r requirements.txt


  codeql:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3


  docker-build-and-scan:
    needs:
      - test
      - dependency-scan
      - codeql

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --no-cache -t github-actions-demo:${{ github.sha }} .

      - name: Inspect setuptools
        run: docker run --rm github-actions-demo:${{ github.sha }} python -m pip show setuptools

      - name: Inspect msgpack
        run: docker run --rm github-actions-demo:${{ github.sha }} python -m pip show msgpack

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DEBUG: true
        with:
          image-ref: github-actions-demo:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true